<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopeful ELIZA</title>
<style>
  body { background: #fff; color: #000; margin: 0; }
  #wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  #log { height: 50vh; overflow-y: auto; display: flex; flex-direction: column; }
  #log p:first-child { margin-top: auto; }
  #log p { margin: 0 0 12px; }
  #form { display: flex; gap: 8px; margin-top: 12px; }
  #input { flex: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type here and press Enter">
    <button>Send</button>
  </form>
</div>


<script>
// ELIZA engine: a JavaScript port of wadetb/eliza (eliza.py)
const initials = [], finals = [], quits = [];
const pres = {}, posts = {}, synons = {}, keys = {};
const memory = [];

// ---- load the rules ----
function loadRules(text) {
let key = null, decomp = null;
for (const raw of text.split('\n')) {
  if (!raw.trim()) continue;
  const i = raw.indexOf(':');
  const tag = raw.slice(0, i).trim();
  const content = raw.slice(i + 1).trim();
  const parts = content.split(' ');
  if (tag === 'initial') initials.push(content);
  else if (tag === 'final') finals.push(content);
  else if (tag === 'quit') quits.push(content);
  else if (tag === 'pre') pres[parts[0]] = parts.slice(1);
  else if (tag === 'post') posts[parts[0]] = parts.slice(1);
  else if (tag === 'synon') synons[parts[0]] = parts;
  else if (tag === 'key') {
    key = { word: parts[0], weight: parts.length > 1 ? parseInt(parts[1]) : 1, decomps: [] };
    keys[parts[0]] = key;
  } else if (tag === 'decomp') {
    let save = false, p = parts;
    if (p[0] === '$') { save = true; p = p.slice(1); }
    decomp = { parts: p, save: save, reasmbs: [], next: 0 };
    key.decomps.push(decomp);
  } else if (tag === 'reasmb') decomp.reasmbs.push(parts);
}
}

// ---- matching ----
function matchR(parts, words, results) {
  if (!parts.length && !words.length) return true;
  if (!parts.length || (!words.length && !(parts.length === 1 && parts[0] === '*'))) return false;
  if (parts[0] === '*') {
    for (let i = words.length; i >= 0; i--) {
      results.push(words.slice(0, i));
      if (matchR(parts.slice(1), words.slice(i), results)) return true;
      results.pop();
    }
    return false;
  }
  if (parts[0].startsWith('@')) {
    const root = parts[0].slice(1);
    if (!synons[root].includes(words[0].toLowerCase())) return false;
    results.push([words[0]]);
    return matchR(parts.slice(1), words.slice(1), results);
  }
  if (parts[0].toLowerCase() !== words[0].toLowerCase()) return false;
  return matchR(parts.slice(1), words.slice(1), results);
}

function sub(words, table) {
  const out = [];
  for (const w of words) {
    const l = w.toLowerCase();
    if (table[l]) out.push(...table[l]); else out.push(w);
  }
  return out;
}

function nextReasmb(d) {
  const r = d.reasmbs[d.next % d.reasmbs.length];
  d.next++;
  return r;
}

function reassemble(reasmb, results) {
  const out = [];
  for (const w of reasmb) {
    if (!w) continue;
    if (w[0] === '(' && w[w.length - 1] === ')') {
      let insert = results[parseInt(w.slice(1, -1)) - 1];
      for (const p of [',', '.', ';']) {
        const at = insert.indexOf(p);
        if (at >= 0) insert = insert.slice(0, at);
      }
      out.push(...insert);
    } else out.push(w);
  }
  return out;
}

function matchKey(words, k) {
  for (const d of k.decomps) {
    let results = [];
    if (!matchR(d.parts, words, results)) continue;
    results = results.map(r => sub(r, posts));
    const reasmb = nextReasmb(d);
    if (reasmb[0] === 'goto') return matchKey(words, keys[reasmb[1]]);
    const out = reassemble(reasmb, results);
    if (d.save) { memory.push(out); continue; }
    return out;
  }
  return null;
}

function respond(text) {
  text = text.replace(/[?!]/g, '');
  if (quits.includes(text.trim().toLowerCase())) return null;
  text = text.replace(/\s*\.+\s*/g, ' . ').replace(/\s*,+\s*/g, ' , ').replace(/\s*;+\s*/g, ' ; ');
  let words = text.split(' ').filter(w => w);
  words = sub(words, pres);
  const found = words.filter(w => keys[w.toLowerCase()]).map(w => keys[w.toLowerCase()]);
  found.sort((a, b) => b.weight - a.weight);
  let out = null;
  for (const k of found) {
    out = matchKey(words, k);
    if (out) break;
  }
  if (!out) {
    if (memory.length) out = memory.splice(Math.floor(Math.random() * memory.length), 1)[0];
    else out = nextReasmb(keys['xnone'].decomps[0]);
  }
  return tidy(out.join(' '));
}

// "hello . how are you ?" -> "Hello. How are you?"
function tidy(s) {
  s = s.replace(/\s+([.,?;])/g, '$1');
  return s.replace(/(^|[.?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase());
}

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// ---- page ----
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');

function say(who, text) {
  const p = document.createElement('p');
  p.textContent = who + ': ' + text;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

// The bot's personality lives in hope.txt (same folder as this page)
input.disabled = true;
fetch('hope.txt')
  .then(r => r.text())
  .then(text => {
    loadRules(text);
    say('ELIZA', tidy(pick(initials)));
    input.disabled = false;
    input.focus();
  })
  .catch(() => say('ELIZA', 'Could not load hope.txt.'));

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  say('You', text);
  input.value = '';
  const reply = respond(text);
  if (reply === null) {
    say('ELIZA', tidy(pick(finals)));
    input.disabled = true;
  } else {
    setTimeout(() => say('ELIZA', reply), 600);
  }
});

</script>
</body>
</html>
